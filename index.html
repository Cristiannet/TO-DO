<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué hay pa' hacer hoy? | TO DO</title>
<meta name="description" content="Lista de tareas personal con calendario, pomodoro y música.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar fixed-top barra">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">TO DO<span>.</span></a>
    <button id="tema" class="btn-tema" aria-label="Invertir colores">◐</button>
  </div>
</nav>

<main class="container pt-5 pb-5">
  <header class="cabecera">
    <p class="eyebrow mb-2" id="fechaHoy"></p>
    <h1 class="titulo">¿QUÉ HAY<br><span class="outline">PA' HACER HOY?</span></h1>
  </header>

  <div class="row g-4">
    <!-- COLUMNA IZQUIERDA -->
    <aside class="col-lg-4">
      <section class="caja mb-4">
        <p class="mini">Calendario</p>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <button class="btn-mes" id="mesAnt" aria-label="Mes anterior">←</button>
          <b id="mesTitulo" class="text-capitalize"></b>
          <button class="btn-mes" id="mesSig" aria-label="Mes siguiente">→</button>
        </div>
        <div class="cal" id="calendario"></div>
        <button class="btn-link-b mt-3" id="quitarFiltro" hidden>Quitar filtro de día ✕</button>
      </section>

      <section class="caja mb-4 text-center">
        <p class="mini text-start">Pomodoro timer</p>
        <div class="d-flex gap-2 justify-content-center mb-3">
          <button class="pill activo" data-min="25">Enfoque</button>
          <button class="pill" data-min="5">Corto</button>
          <button class="pill" data-min="15">Largo</button>
        </div>
        <div class="reloj" id="reloj">25:00</div>
        <div class="d-flex gap-2 justify-content-center mt-3">
          <button class="btn btn-brand" id="pomoInicio">Iniciar</button>
          <button class="btn btn-brand-outline" id="pomoReset">Reiniciar</button>
        </div>
        <p class="meta mt-3 mb-0">Pomodoros hoy: <b id="pomoCont">0</b></p>
      </section>

      <section class="caja">
        <p class="mini">Música</p>
        <button class="btn btn-brand w-100" id="spotifyBtn">Reproducir Spotify ▶</button>
        <div id="spotifyWrap" class="mt-3" hidden>
          <iframe title="Spotify" style="border-radius:12px" src="" data-src="https://open.spotify.com/embed/playlist/37i9dQZF1DWZeKCadgRdKQ?utm_source=generator&theme=0" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
      </section>
    </aside>

    <!-- COLUMNA DERECHA -->
    <section class="col-lg-8">
      <button class="btn-nueva w-100" data-bs-toggle="modal" data-bs-target="#modalTarea">+ Crear nueva tarea</button>

      <p class="mini mt-4" id="listaTitulo">Tareas</p>
      <div class="row g-4" id="listaTareas"></div>

      <div class="text-center mt-4">
        <button class="btn btn-brand-outline" id="verMas" hidden>Ver más</button>
      </div>

      <div class="row g-4 mt-2">
        <div class="col-md-6"><div class="stat"><b id="nComp">0</b><span>Tareas completadas</span></div></div>
        <div class="col-md-6"><div class="stat"><b id="nPend">0</b><span>Tareas pendientes</span></div></div>
      </div>
    </section>
  </div>
</main>

<!-- MODAL NUEVA TAREA -->
<div class="modal fade" id="modalTarea" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content caja-modal" id="formTarea">
      <div class="modal-header border-0">
        <h2 class="h4 fw-bold m-0">Nueva tarea</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <label class="mini" for="tTitulo">Título</label>
        <input id="tTitulo" class="form-control campo mb-3" required maxlength="60" placeholder="Ej: Terminar el taller">
        <label class="mini" for="tDesc">Descripción (opcional)</label>
        <textarea id="tDesc" class="form-control campo mb-3" rows="2" maxlength="140"></textarea>
        <label class="mini" for="tFecha">Fecha</label>
        <input id="tFecha" type="date" class="form-control campo" required>
      </div>
      <div class="modal-footer border-0">
        <button type="submit" class="btn btn-brand">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
